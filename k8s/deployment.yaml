apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-svm-predictor
  namespace: default
  labels:
    app: quantum-svm-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantum-svm-predictor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantum-svm-predictor
    spec:
      containers:
      - name: quantum-svm-app
        image: quantum-svm-predictor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
