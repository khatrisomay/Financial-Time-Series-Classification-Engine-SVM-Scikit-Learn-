version: '3.8'

services:
  stock-svm-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-svm-predictor-prod
    ports:
      - "8000:8000"
    restart: always
    environment:
      - ENV=production
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
