name: Security SAST & Vulnerability Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-security:
    name: Bandit SAST Python Code Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Bandit Security Scan
      run: |
        pip install bandit
        bandit -r backend/app/ -s B101,B104 || true
