<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum SVM Stock Predictor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "border-glow": "rgba(37, 99, 235, 0.2)",
              "surface-container-low": "#181b24",
              "signal-negative": "#F43F5E",
              "signal-positive": "#10B981",
              "primary": "#b4c5ff",
              "primary-container": "#2563eb",
              "on-primary-container": "#eeefff",
              "secondary": "#4cd7f6",
              "background": "#070A12",
              "surface": "#10131c",
              "on-surface": "#e0e2ee",
              "on-surface-variant": "#c3c6d7",
              "text-muted": "#94A3B8",
              "surface-glass": "#0F172A",
              "surface-variant": "#31353e",
              "surface-container-high": "#272a33",
              "surface-container-lowest": "#0b0e16"
            },
            fontFamily: {
              "display-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "label-caps": ["JetBrains Mono", "monospace"],
              "headline-md": ["Inter", "sans-serif"],
              "data-lg": ["JetBrains Mono", "monospace"],
              "data-md": ["JetBrains Mono", "monospace"],
              "data-sm": ["JetBrains Mono", "monospace"],
              "headline-sm": ["Inter", "sans-serif"],
              "body-sm": ["Inter", "sans-serif"]
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #070A12;
        color: #e0e2ee;
        font-family: 'Inter', sans-serif;
        background-image: radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.08) 0%, transparent 45%);
        background-attachment: fixed;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(37, 99, 235, 0.2);
      }
      .active-glow {
        box-shadow: inset 0 0 8px rgba(37, 99, 235, 0.3), 0 0 15px rgba(37, 99, 235, 0.4);
        border-color: #4cd7f6;
      }
      .text-neon { text-shadow: 0 0 8px rgba(76, 215, 246, 0.5); }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
